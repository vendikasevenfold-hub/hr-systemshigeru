<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Shigeru HR</title>

  <!-- https://script.google.com/macros/s/AKfycbxrHSgAdFZymzV9M9J4y7GOO3KyRIjguJpDzsv8EatC5gyBCowP2_VnLZTRSlskqtL0/exec -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/GANTI_DENGAN_DEPLOYMENT_ID_ANDA/exec">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Source+Sans+3:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Token SHIGERU — sama dengan Shigeru Console (shigeru-platform). */
    :root {
      --bg:      #ffffff;   /* Paper */
      --surface: #f7f7f7;   /* Tray */
      --fg:      #333333;   /* Ink */
      --muted:   #6f6f6f;   /* Grey Copy */
      --border:  #dddddd;   /* Hairline */
      --accent:  #f54442;   /* Shigeru Red */
      --sumi:    #252525;   /* Sumi Black */

      --font-display: 'Source Sans 3', 'Source Sans Pro', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-body:    'Karla', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-mono:    SFMono-Regular, Consolas, 'Liberation Mono', Menlo, Courier, monospace;

      --radius: 15px;
      --shadow-card: 0 10px 28px 4px color-mix(in oklch, var(--fg) 9%, transparent);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 16px;
      font-family: var(--font-body);
      font-size: 14px;
      background: var(--surface);
      color: var(--fg);
      text-align: center;
    }

    .wrap { width: min(420px, 100%); }

    /* Brand: cakram Shigeru Red dengan glyph 繁, "Shigeru" + sub mono. */
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 24px;
    }
    .brand-mark {
      width: 38px; height: 38px; flex: none;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-size: 19px; font-weight: 700; line-height: 1;
    }
    .brand-glyph { display: block; font-style: normal; transform: translate(1px, 1px); }
    .brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
    .brand-sub { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 28px 24px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 16px auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .btn {
      display: inline-block;
      background: var(--sumi);
      color: var(--bg);
      font-weight: 600;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
    }
    .btn:hover { background: var(--fg); }
  </style>

  <script>
    // Redirect via JavaScript (cadangan jika meta refresh diblokir browser/proxy)
    window.location.replace("https://script.google.com/macros/s/GANTI_DENGAN_DEPLOYMENT_ID_ANDA/exec");
  </script>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i class="brand-glyph">繁</i></span>
      <span>
        <span class="brand-name">Shigeru</span> <span class="brand-sub">HR</span>
      </span>
    </div>
    <div class="card">
      <div class="spinner"></div>
      <h1>Mengalihkan ke Shigeru HR…</h1>
      <p>Jika tidak otomatis berpindah dalam beberapa detik, klik tombol di bawah ini.</p>
      <a class="btn" href="https://script.google.com/macros/s/GANTI_DENGAN_DEPLOYMENT_ID_ANDA/exec">Buka Shigeru HR</a>
    </div>
  </div>
</body>
</html>
