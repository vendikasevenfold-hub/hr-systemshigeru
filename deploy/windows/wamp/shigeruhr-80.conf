# =====================================================================
# Shigeru HR - port 80 (WAMP di VPS 154.19.37.228)
# Salin ke: C:\wamp64\bin\apache\apache2.4.65\conf\extra\shigeruhr-80.conf
# Di-Include dari bagian paling bawah httpd.conf.
# =====================================================================

# 1) VirtualHost bawaan port 80 - HARUS paling atas.
#    Sebelum file ini ada, port 80 tidak punya VirtualHost dan dilayani konfigurasi utama
#    (folder www, aturan akses WAMP). Begitu ada VirtualHost *:80 lain, Apache memakai
#    VirtualHost pertama untuk semua nama yang tidak cocok. Blok ini menjaga
#    http://assets.shigerudeli.com dan alamat lain tetap berperilaku seperti sebelumnya.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "${INSTALL_DIR}/www"
</VirtualHost>

# 2) Subdomain HR: hanya untuk verifikasi sertifikat Let's Encrypt, sisanya ke HTTPS.
<VirtualHost *:80>
    ServerName shigeruhr.shigerudeli.com

    Alias /.well-known/acme-challenge/ "C:/shigeru-hr-acme/.well-known/acme-challenge/"
    <Directory "C:/shigeru-hr-acme/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://shigeruhr.shigerudeli.com%{REQUEST_URI} [R=301,L]
</VirtualHost>
