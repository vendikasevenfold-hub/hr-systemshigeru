# =====================================================================
# Shigeru HR - HTTPS (port 443) -> aplikasi di http://127.0.0.1:3100
# Salin ke: C:\wamp64\bin\apache\apache2.4.65\conf\extra\shigeruhr-443.conf
# Di-Include SETELAH sertifikat dari win-acme ada di C:\shigeru-hr-certs.
#
# VirtualHost GLPI (assets.shigerudeli.com) di httpd-vhosts.conf dimuat lebih dulu,
# jadi tetap menjadi bawaan port 443. Blok ini hanya melayani shigeruhr.shigerudeli.com.
# =====================================================================

<VirtualHost *:443>
    ServerName shigeruhr.shigerudeli.com

    SSLEngine on
    SSLCertificateFile    "C:/shigeru-hr-certs/shigeruhr.shigerudeli.com-chain.pem"
    SSLCertificateKeyFile "C:/shigeru-hr-certs/shigeruhr.shigerudeli.com-key.pem"

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  "${INSTALL_DIR}/logs/shigeruhr-error.log"
    CustomLog "${INSTALL_DIR}/logs/shigeruhr-access.log" common
</VirtualHost>
