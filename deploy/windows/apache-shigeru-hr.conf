# =====================================================================
# Apache: subdomain HR -> aplikasi Shigeru HR (http://127.0.0.1:3100)
#
# 1. Ganti hr.contoh.co.id dengan subdomain Anda (4 tempat di file ini).
# 2. Salin file ini ke folder conf Apache, misalnya:
#      C:\xampp\apache\conf\extra\shigeru-hr.conf      (XAMPP)
#      C:\Apache24\conf\extra\shigeru-hr.conf          (Apache Lounge)
# 3. Di httpd.conf pastikan baris-baris ini aktif (hapus tanda # di depannya):
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
#      LoadModule headers_module modules/mod_headers.so
#      LoadModule ssl_module modules/mod_ssl.so        (untuk HTTPS)
#      LoadModule rewrite_module modules/mod_rewrite.so
#    lalu tambahkan di bagian paling bawah httpd.conf:
#      Include conf/extra/shigeru-hr.conf
# 4. PENTING untuk GLPI: baca bagian "Apache & GLPI" di PANDUAN-VPS.md sebelum restart Apache.
# =====================================================================

# ---------- HTTP: hanya untuk verifikasi sertifikat lalu dialihkan ke HTTPS ----------
<VirtualHost *:80>
    ServerName hr.contoh.co.id

    # Folder verifikasi Let's Encrypt (win-acme)
    Alias /.well-known/acme-challenge/ "C:/shigeru-hr-acme/.well-known/acme-challenge/"
    <Directory "C:/shigeru-hr-acme/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ---------- HTTPS: diteruskan ke aplikasi ----------
<VirtualHost *:443>
    ServerName hr.contoh.co.id

    SSLEngine on
    # Lokasi file sertifikat hasil win-acme (lihat PANDUAN-VPS.md langkah 7)
    SSLCertificateFile    "C:/shigeru-hr-certs/hr.contoh.co.id-crt.pem"
    SSLCertificateKeyFile "C:/shigeru-hr-certs/hr.contoh.co.id-key.pem"
    SSLCertificateChainFile "C:/shigeru-hr-certs/hr.contoh.co.id-chain.pem"

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  "logs/shigeru-hr-error.log"
    CustomLog "logs/shigeru-hr-access.log" common
</VirtualHost>
